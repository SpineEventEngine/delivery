syntax = "proto3";

package spine.test.delivery;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.test.delivery.server";
option java_outer_classname = "GivenEventsProto";
option java_multiple_files = true;

message SmthDone {

    string id = 1;

    string what_was_done = 2;
}
