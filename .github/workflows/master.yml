name: Build and Publish

on:
  push:
    branches: [ 'master' ]
  workflow_dispatch:

jobs:
  build-server:
    name: Build Server
    runs-on: 'ubuntu-latest'
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: 'true'
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'
      # Provisions the Gradle distribution and caches `~/.gradle`. Replaces the
      # manual `actions/cache@v3`.
      - uses: gradle/actions/setup-gradle@v6
      - name: Build Server
        run: ./gradlew build --stacktrace
        env:
          # See the note in `pr.yml` about the GitHub Packages `read:packages` credential.
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

