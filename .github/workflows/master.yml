  #     (see `.agents/tasks/admin-ui-gradle-9.md`).
  #   * `build-client` / `deploy-*` drive the decoupled `client` build (Spine 1.x /
  #     Gradle 6, built via `client/gradlew`) and the parked deployment modules
  #     `server-cloud-run` / `simple-server-cloud-run` (`jib`) — see
  #     `.agents/tasks/deployment-gradle-9.md`.
