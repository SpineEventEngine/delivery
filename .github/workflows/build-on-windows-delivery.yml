# This repo-specific workflow replaces the generic `build-on-windows.yml` that the
# `config` submodule distributes. It sets `WINDOWS_CI_NO_DOCKER` so the Docker-based
# Redis Testcontainers suites are skipped on GitHub's Windows runners, which can only
# run Windows containers and cannot launch the Linux `redis:6-alpine` image. The
# directive below tells `config/migrate` not to copy the generic workflow here.
# config:replaces build-on-windows.yml
name: Windows CI

on: pull_request

jobs:
  build:
    runs-on: windows-latest
    name: Build on Windows

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: zulu

      - uses: gradle/actions/setup-gradle@v6

      # See: https://github.com/al-cheb/configure-pagefile-action
      - name: Configure Pagefile
        uses: al-cheb/configure-pagefile-action@v1.3

      # GitHub-hosted Windows runners cannot launch the Linux Docker container that the
      # Redis Testcontainers tests need. `WINDOWS_CI_NO_DOCKER` signals this: the
      # `checkDockerAvailable` Gradle gate passes without probing Docker, and the redis
      # suites (annotated `@RequiresDocker`) are skipped by `RequiresDockerCondition`.
      # The remaining tests still run, so this job is a Windows compilation + unit-test
      # check. Docker stays mandatory everywhere else (dev machines and the Ubuntu runner).
      - name: Build project and run tests
        shell: cmd
        run: gradlew.bat build --stacktrace
        env:
          WINDOWS_CI_NO_DOCKER: "true"

      # See: https://github.com/marketplace/actions/junit-report-action
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v4.0.3
        if: always() # always run even if the previous step fails
        with:
          report_paths: '**/build/test-results/**/TEST-*.xml'
          require_tests: true
