# The module now builds within the root project, whose toolchain targets Java 17
# (`BuildSettings.javaVersion`), so the staged JAR carries Java 17 bytecode and
# cannot start on the `java11` runtime this used to declare.
runtime: java17
env: standard
service: 'simple-message-delivery-client-j11'
entrypoint: >
  java
  -server
  -XX:+DisableExplicitGC
  -agentpath:/opt/cdbg/cdbg_java_agent.so=--log_dir=/var/log
  -agentpath:/opt/cprof/profiler_java_agent.so=-logtostderr,-cprof_enable_heap_sampling=true,-minloglevel=2
  -Dflogger.backend_factory=com.google.common.flogger.backend.log4j2.Log4j2BackendFactory#getInstance
  -jar app.jar
instance_class: B2
basic_scaling:
  max_instances: 1
inbound_services:
  - warmup
handlers:
  - url: /.*
    script: unused
    login: optional
    secure: optional
vpc_access_connector:
  name: "projects/spine-dev/locations/us-central1/connectors/app-engine-test-connector"
