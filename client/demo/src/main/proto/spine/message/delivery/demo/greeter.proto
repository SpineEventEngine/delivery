syntax = "proto3";

package spine.message.delivery.demo;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package="io.spine.message.delivery.demo";
option java_outer_classname = "GreeterProto";
option java_multiple_files = true;
option java_generate_equals_and_hash = true;

// Says hello to a person only once.
message Greeter {
    option (entity).kind = AGGREGATE;

    // The ID of the greeter.
    string id = 1;

    // Names of people whom the greeter has already greet.
    repeated string name = 2;
}
