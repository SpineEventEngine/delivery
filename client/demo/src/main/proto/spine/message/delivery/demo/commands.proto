syntax = "proto3";

package spine.message.delivery.demo;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package="io.spine.message.delivery.demo.command";
option java_outer_classname = "CommandsProto";
option java_multiple_files = true;
option java_generate_equals_and_hash = true;

// Says hello to a person.
message SayHello {

    // The name of the person whom we greet.
    string name = 1 [(required) = true];
}

// Greets the whole army.
message GreetAnArmy {

    // The number of soldiers in an army.
    int32 how_many_soldiers = 1 [(required) = true];
}
