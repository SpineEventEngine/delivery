syntax = "proto3";

package spine.message.delivery.demo;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package="io.spine.message.delivery.demo.event";
option java_outer_classname = "EventsProto";
option java_multiple_files = true;
option java_generate_equals_and_hash = true;

// Said hello to a person.
message SaidHello {

    // The name of the person whom we greet.
    string name = 1 [(required) = true];

    // The whole greeting text.
    string greeting = 2 [(required) = true];
}
