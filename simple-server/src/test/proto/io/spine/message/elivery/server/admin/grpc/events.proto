syntax = "proto3";

package spine.message.delivery;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.message.delivery.server.event";
option java_outer_classname = "TestEventsProto";
option java_multiple_files = true;
option java_generate_equals_and_hash = true;

// ID of the event message for testing purposes.
message TestEventId {

    string value = 1;
}

// Meaningless event message for testing purposes.
message TestEvent {

    TestEventId id = 1;
}
