syntax = "proto3";

package spine.delivery.storage;

import "spine/options.proto";

option (type_url_prefix) = "type.spine.io";
option java_package = "io.spine.delivery.storage";
option java_outer_classname = "StoredShardSessionProto";
option java_multiple_files = true;
option java_generate_equals_and_hash = true;

import "spine/server/delivery/delivery.proto";

// The form in which the Redis and Hazelcast stores keep the session record of a shard.
//
// Next to the record, it keeps the ID of the write that stored the record. A writer that did
// not learn the outcome of its write tells by that ID whether the record it finds is its own,
// even when another write stored an equal record.
message StoredShardSession {

    // The ID of the write that stored the record, a UUID in its string form.
    string write_id = 1 [(required) = true];

    // The session record of the shard.
    spine.server.delivery.ShardSessionRecord record = 2 [(required) = true];
}
